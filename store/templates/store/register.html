{% extends 'store/base.html' %}
{% load static %}

{% block title %}Create Account – NovaCart{% endblock %}

{% block content %}
<div class="auth-section">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join NovaCart for a fast, modern shopping experience</p>
      </div>

      <form method="POST" action="{% url 'register' %}">
        {% csrf_token %}

        <div class="form-group">
          <label for="regUsername" class="form-label">Username</label>
          <div class="input-wrapper">
            <input type="text" name="username" id="regUsername" class="form-control" placeholder="Choose a unique username" value="{{ username|default:'' }}" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address (Optional)</label>
          <div class="input-wrapper">
            <input type="email" name="email" id="regEmail" class="form-control" placeholder="name@example.com" value="{{ email|default:'' }}">
          </div>
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password (Minimum 6 characters)</label>
          <div class="input-wrapper">
            <input type="password" name="password" id="regPassword" class="form-control" placeholder="Create a strong password" minlength="6" required>
            <button type="button" class="password-toggle-btn" data-target="regPassword">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control" placeholder="Confirm your password" minlength="6" required>
            <button type="button" class="password-toggle-btn" data-target="regConfirmPassword">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitRegisterBtn" style="margin-top: 12px;">
          Create My Account
        </button>
      </form>

      <div class="auth-footer">
        Already registered?
        <a href="{% url 'login' %}">Sign in here</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
