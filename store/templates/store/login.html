{% extends 'store/base.html' %}
{% load static %}

{% block title %}Sign In – NovaCart{% endblock %}

{% block content %}
<div class="auth-section">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your account to manage your cart & orders</p>
      </div>

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
          <label for="usernameInput" class="form-label">Username</label>
          <div class="input-wrapper">
            <input type="text" name="username" id="usernameInput" class="form-control" placeholder="Enter your username" value="{{ username|default:'' }}" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
            <button type="button" class="password-toggle-btn" data-target="passwordInput">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitLoginBtn" style="margin-top: 12px;">
          Sign In to NovaCart
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet?
        <a href="{% url 'register' %}">Create an account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
